<!DOCTYPE html> 
<html lang="en"> <!-- 기본언어 : 영어-->
<head>
    <meta charset="UTF-8" /> <!--페이지 언어 인코딩 형식-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <!--화면크기에 따라 보여지는 크기 맞추기-->
    <title>Web Animation(canvas_js_css)[1단원-3]</title> 
    <style>
        /* 페이지 전체 설정*/
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: sans-serif;
        }
        /* 애니메이션 화면 설정 */
        #canvas {
            background: #DCD7C9;
            display: block;
            margin: 0 auto;
        }

        /* ★1_5 : pc 안내 문구 기본은 숨김 */
        .pc-guide {
            display: none;/* : 화면에 보여지지 않게함*/
            margin-top: 10px;/*★1_5 : 위쪽 여백*/
            font-size: 16px; /*★1_5 : 버튼 글자크기 */
            color: #333; /* ★1_5 : 글자색 */
            font-weight: bold; /* ★1_5 : 글자굵게 */
        }
        /* PC에서는 600x600 고정 */
        @media (min-width: 769px) {
            #canvas {
                width: 600px;
                height: 600px;
          }

          .pc-guide{
            display:block; /*★1_5 : pc-guide를 pc에서 접속시 보이게함 */
            }
        }
        /* ★1_5 : 버튼들을 감싸는 div 숨기기 (pc에서는 안 보이게하고 스마트폰에서 접속이 보임)*/
        .controls {
            display: none; /* ★1_5 : 화면에 보이지 않게함 */
            margin-top: 10px; /* ★1_5 : 위쪽 즉 캔버스하고 여백을 10픽셀줌 */
        }

        /* ★1_5 : 스마트폰에서 보여질 버튼 모양 설정 */
        .controls button{
            font-size: 18px; /* ★1_5 : 버튼 글자크기 */
            padding: 10px 20px; /* ★1_5: 버튼 바깥쪽 여백을 5픽셀줌 */
            margin: 5px;
        }
        /* ★1_5 : 화면이 작을 때 (스마트폰 등에서 보인다면 아래 코드동작)
            화면의 폭이 최대 768픽셀보다 이하이면 아래 css동작함 아니면 위 pc용 css @media (min-width: 769px)동작함
            어 최근 스마트폰의 해상도는 pc보다도 좋은 경우가 많은데 768픽셀보다 작으면 스마트폰이라니?
            ★이유 : 스마트폰의 물리적인 해상도는 더 크지만, 화면을 작게 보이도록 하기 위해 **디바이스 픽셀 비율(DRR, devicePixelRatio)**을 사용함
            현재 기기로 보아도 768 css픽셀이면 모든 스마트폰에서 접속하는 것으로 판단함^^
        */
        @media (max-width: 768px) {
            #canvas {
                width: 100vw; /* ★1_5 : 스마트폰 화면 canvas 가로 전체 크기로함 */
                height: 100vw; /* ★1_5 : 화면 canvas 세로 = 가로 (정사각형) */
            }
            .controls{
                display: block; /* ★1_5 : 스마트폰에서 접속시 controls을 보이게함 */
            }
            .pc-guide{
                display: none; /* ★1_5 : pc-guide를 스마트폰 접속시 숨김 */
            }
        }
        #restarBtn{
            display: none;
        }
        #over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: white;
        }
    </style> 
</head>
<body>
    <button id="restartBtn" style="
    position:absolute;
    left:50%;
    top:60%;
    transform:translate(-50%,-50%);
    padding:15px 30px;
    font-size:20px;
    display:none;
    ">재시작</button>




   
    <h1 id="timer" style="font-weight: normal; font-size: small;text-align: center;">00:00</h1>
    
    <h1 id="count" style="font-weight: normal; font-size: small;">RED no 0</h1>
    
    <!--애니메이션 화면 만들기<div style="text-align:right;">
    </div>
    -->
    <canvas id="canvas"></canvas> 
    <!-- ★1_5 : 애니메이션 화면 만들기 : 스마트폰에서 접속 할 때만 controls이 보이게됨-->
    <div class="controls">
        <button id="leftBtn">◁</button>
        <button id="rightBtn">▷</button>
        <button id="upBtn">△</button>
        <button id="downBtn">▽</button>
    </div>

    <!--★1_5 : pc 전용 안내 문구-->
    <div class="pc-guide">
        PC에서 접속했습니다. 방향키로 이동하세요.<br>
        스마트폰은 접속 시 보이는 버튼으로 이동하세요.
    </div>



    <script>
        let ccount = 5
        let totalSeconds = 0;     // 전체 초
        let timerId = null;       // 타이머 ID
        let stopSignal = false;   // 신호. true가 되면 멈춤 (원하는 이벤트와 연결 가능)

    // 00:00 형식으로 화면 업데이트하는 함수
    


    function countt(){
        document.getElementById("count").innerText = 'RED no '+ ccount;
    }
    function updateDisplay() {
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;

        let m = String(minutes).padStart(2, '0');
        let s = String(seconds).padStart(2, '0');
        document.getElementById("timer").innerText = `${m}:${s}`;
    }

    // 타이머 자동 시작
    function startTimer() {
        document.getElementById("restartBtn").style.display = "none";
        timerId = setInterval(function() {
            if (ccount <= 0) {
                stopSignal = true;
            }
            // ❗ stopSignal이 true가 되면 자동 정지
            if (stopSignal === true) {
                clearInterval(timerId);
                console.log("타이머 정지: 신호 감지됨");
                over();
                return;
            }

            // 타이머 증가
            totalSeconds++;
            updateDisplay();
           
        }, 1000);
    }

    window.onload = function() {

        startTimer();
    };
        // 캔버스 요소 JS 변수 만들기
        const drawingBoard = document.getElementById('canvas'); 
        // 캔버스에 2D그림을 그리는 도구 변수만들기
        const drawingPen = drawingBoard.getContext('2d'); 

        // 캔버스 크기를 CSS와 맞춰줌 (중요!)
        // 아래처럼 하면 PC는 600x600으로 설정되고 스마트폰은 360x360으로 화면계산됨★나중에 필요하면 참고사용★
        // drawingBoard.height = drawingBoard.clientHeight;
        // drawingBoard.width = drawingBoard.clientWidth
        // 캔버스 내부 해상도는 무조건 600x600 고정(pc, 스마트폰 모두)
        drawingBoard.width = 600; 
        drawingBoard.height = 600; 
      
        //console.log(randomNumFloor)
        //화면 가운데 위치
        let x = (drawingBoard.width - 10) / 2; 
        let y = (drawingBoard.height - 10) / 2;

        const enemyX1 = Math.floor(Math.random() * 481 + 30);
        const enemyY1 = Math.floor(Math.random() * 481 + 30);

        const enemyX2 = Math.floor(Math.random() * 481 + 30);
        const enemyY2 = Math.floor(Math.random() * 481 + 30);

        const enemyX3 = Math.floor(Math.random() * 481 + 30);
        const enemyY3 = Math.floor(Math.random() * 481 + 30);

        const enemyX4 = Math.floor(Math.random() * 481 + 30);
        const enemyY4 = Math.floor(Math.random() * 481 + 30);

        const enemyX5 = Math.floor(Math.random() * 481 + 30);
        const enemyY5 = Math.floor(Math.random() * 481 + 30);
        const enemySize = 20;

        let enemyVisible1 = true;
        let enemyVisible2 = true;
        let enemyVisible3 = true;
        let enemyVisible4 = true;
        let enemyVisible5 = true;
        
      
        
        //주인공 이동속도
        const moveAmount = 5; 

        //주인공 이동함수
        function moveRight() {
            x = x + moveAmount;
        }

        function moveLeft() {
            x = x - moveAmount;
        }

        function moveDown() {
            y = y + moveAmount;
        }

        function moveUp() {
            y = y - moveAmount;
        }
        // ★1_4 : 주인공 이동제한
        function move_limit(){
            if (x < 0){ //왼쪽이동제한
                x=0;
            }
            if (x > 590){
                x=590;
            }
            if(y < 0){
                y=0;
            }
            if(y > 590){
                y=590;
            }

        }

        function enemy1(){
            if(enemyVisible1){
                drawingPen.fillStyle = 'red';
                drawingPen.fillRect(enemyX1,enemyY1,20,20);
            }
        }

        function enemy2(){
            if(enemyVisible2){
                drawingPen.fillStyle = 'red';
                drawingPen.fillRect(enemyX2,enemyY2,20,20);
            }
        }

        function enemy3(){
            if(enemyVisible3){
                drawingPen.fillStyle = 'red';
                drawingPen.fillRect(enemyX3,enemyY3,20,20);
            }
        }

        function enemy4(){
            if(enemyVisible4){
                drawingPen.fillStyle = 'red';
                drawingPen.fillRect(enemyX4,enemyY4,20,20);
            }
        }

        function enemy5(){
            if(enemyVisible5){
                drawingPen.fillStyle = 'red';
                drawingPen.fillRect(enemyX5,enemyY5,20,20);
            }
        }

        function collision5(){
            if(!enemyVisible5) return;

            if(
                x < enemyX5 + enemySize &&
                x + 10 > enemyX5 &&
                y < enemyY5 + enemySize &&
                y + 10 > enemyY5
            ) {
                enemyVisible5 = false;
                ccount--;
            }
        }

        function collision1(){
            if(!enemyVisible1) return;

            if(
                x < enemyX1 + enemySize &&
                x + 10 > enemyX1 &&
                y < enemyY1 + enemySize &&
                y + 10 > enemyY1
            ) {
                enemyVisible1 = false;
                ccount--;
            }
        }

        function collision2(){
            if(!enemyVisible2) return;

            if(
                x < enemyX2 + enemySize &&
                x + 10 > enemyX2 &&
                y < enemyY2 + enemySize &&
                y + 10 > enemyY2
            ) {
                enemyVisible2 = false;
                ccount--;
            }
        }

        function collision3(){
            if(!enemyVisible3) return;

            if(
                x < enemyX3 + enemySize &&
                x + 10 > enemyX3 &&
                y < enemyY3 + enemySize &&
                y + 10 > enemyY3
            ) {
                enemyVisible3 = false;
                ccount--;
            }
        }

        function collision4(){
            if(!enemyVisible4) return;

            if(
                x < enemyX4 + enemySize &&
                x + 10 > enemyX4 &&
                y < enemyY4 + enemySize &&
                y + 10 > enemyY4
            ) {
                enemyVisible4 = false;
                ccount--;
            }
        }
        // ★1_4 : 캔버스 왼쪽 상당에 텍스트 출력함수
        function drawCoordinate() {
            drawingPen.textAlign = "left";       // 원래대로
            drawingPen.textBaseline = "alphabetic"; // 원래대로
            drawingPen.fillStyle = 'black';
            drawingPen.font = '10px sans-serif';
            drawingPen.fillText(`x: ${x} y: ${y}`, 10, 20); //★1_4 : 주인공 좌표출력
            //document.getElementById("restartBtn").style.display = "block";
        }
        
       

        // over 함수: 미션 완료 메시지 + 버튼 보이기
function over() {
    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;
    let m = String(minutes).padStart(2, '0');
    let s = String(seconds).padStart(2, '0');

    drawingPen.clearRect(0, 0, drawingBoard.width, drawingBoard.height);

    // 배경 어둡게
    drawingPen.fillStyle = "rgba(0,0,0,0.6)";
    drawingPen.fillRect(0, 0, drawingBoard.width, drawingBoard.height);

    // 미션 완료 텍스트
    drawingPen.font = "40px sans-serif";
    drawingPen.fillStyle = "white";
    drawingPen.textAlign = "center";
    drawingPen.textBaseline = "middle";
    drawingPen.fillText(`미션완료 ${m}:${s}초`, drawingBoard.width / 2, drawingBoard.height / 2 - 40);



    // ✅ 게임 끝났을 때만 버튼 표시
    const restartBtn = document.getElementById("restartBtn");
    restartBtn.style.display = "block";

    // ✅ 클릭 시 새로고침
    restartBtn.onclick = function() {
        location.reload();
    }
}



// 버튼 클릭하면 페이지 새로고침 (다시 시작)
//document.getElementById("restartBtn").addEventListener("click", function() {
    //location.reload();
//});


        //주인공출력함수
        function drawHere() {
            drawingPen.fillStyle = 'black';
            drawingPen.fillRect(x, y, 10, 10);
        }


        // 화면에 출력하기
        function draw() {
            drawingPen.clearRect(0, 0, canvas.width, canvas.height); //화면지우기
            drawHere(); //주인공출력함수호출
            move_limit(); //★1_4 : 주인공 이동제한 함수호출
            drawCoordinate(); //★1_4 : 텍스트 출력 함수호출  
            //over();
            enemy1();
            enemy2();
            enemy3();
            enemy4();
            enemy5();
            collision1();
            collision2();
            collision3();
            collision4();
            collision5();
            countt();
            if(stopSignal===true) {
                over();
            }
        }
       
        setInterval(draw, 16); // 60FPS
        
        // PC 방향키 조작
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowLeft' : moveLeft(); break; 
                case 'ArrowRight' : moveRight(); break; 
                case 'ArrowUp' : moveUp(); break; 
                case 'ArrowDown' : moveDown(); break; 
            }
        });

        // ★1_5 : 버튼 이벤트 연결 : 버튼을 선택하면 해당 함수를 호출해서 주인공 이동
        // document : 현재 웹 페이지 전체를 의미
        // getElementById('leftBtn') : 웹 페이지에서 id가 leftBtn인 **버튼**을 의미
        // addEventListener : "어떤 일이 일어났을 때" 실행할 코드를 지정해주는 함수
        // 'click' : 버튼을 마우스로 클릭했을 때 실행하라는 뜻임
        // moveLeft : 클릭하면 moveLeft함수를 호출함
        document.getElementById('leftBtn').addEventListener('click', moveLeft);
        document.getElementById('rightBtn').addEventListener('click', moveRight);
        document.getElementById('upBtn').addEventListener('click', moveUp);
        document.getElementById('downBtn').addEventListener('click', moveDown);
    </script>
</body>
</html>
